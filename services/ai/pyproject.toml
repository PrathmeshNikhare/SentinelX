# Tool configuration only; dependencies live in requirements*.txt (D-024).
[project]
name = "sentinelx-ai"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sentinelx_ai", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
