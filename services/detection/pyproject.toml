# Tool configuration only; dependencies live in requirements*.txt (D-024).
[project]
name = "sentinelx-detection"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sentinelx_detection", "tests"]

# Libraries without bundled type information.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "confluent_kafka", "confluent_kafka.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the Compose PostgreSQL and Kafka plus Node (runs Drizzle migrations)"]
