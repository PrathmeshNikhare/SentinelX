# SentinelX (D-023, D-079). Ports bind to 127.0.0.1 only. Copy .env.example to .env and set its secrets first.
#   docker compose up -d                          infrastructure only (development: apps run on the host)
#   docker compose --profile app up -d --build    the whole stack (clean-machine demo); Ollama stays on the host
name: sentinelx

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: Zjzt0CxtQtSabV94LWfuhQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for the Compose network, HOST for processes on the host machine.
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 10

  # One-shot: creates topics idempotently once the broker is healthy, then exits.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - security-events
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.15.0
    environment:
      # Every API call needs this key (D-078); /readyz stays open for health checks.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env (see .env.example)}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships without curl; probe /readyz over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- App services (Phase 13, D-079). Images build from the repo root; .env supplies credentials, and
  # scripts/container-env.sh rewrites the database URLs to postgres:5432 inside the network. ---

  # One-shot: migrations, reference data and role logins (as `npm run db:migrate && db:seed && db:roles`).
  setup:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: sentinelx-web:local
    env_file: .env
    command: ["sh", "-c", "npm run --silent db:migrate && npm run --silent db:seed && npm run --silent db:roles"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot: knowledge corpus into knowledge_documents and Qdrant (python -m sentinelx_ai.knowledge).
  knowledge:
    profiles: [app]
    build: { context: ., dockerfile: services/ai/Dockerfile }
    image: sentinelx-ai:local
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    command: ["python", "-m", "sentinelx_ai.knowledge"]
    depends_on:
      setup: { condition: service_completed_successfully }
      qdrant: { condition: service_healthy }
    restart: "no"

  # Internal only: reachable as http://ai:8000 on the Compose network, never published to the host (D-022).
  ai:
    profiles: [app]
    build: { context: ., dockerfile: services/ai/Dockerfile }
    image: sentinelx-ai:local
    env_file: .env
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      knowledge: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    restart: unless-stopped

  detection:
    profiles: [app]
    build: { context: ., dockerfile: services/detection/Dockerfile }
    image: sentinelx-detection:local
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      setup: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: sentinelx-web:local
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      setup: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      ai: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
